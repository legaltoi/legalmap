<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background OLED -->
  <rect width="512" height="512" rx="112" fill="#000000" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGlow)" stroke="#27272a" stroke-width="4" />

  <!-- Radar / Coordinate concentric circles -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#27272a" stroke-width="2" stroke-dasharray="8 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#334155" stroke-width="2" opacity="0.4"/>

  <!-- Compass / Crosshair -->
  <line x1="256" y1="48" x2="256" y2="464" stroke="#1e293b" stroke-width="2"/>
  <line x1="48" y1="256" x2="464" y2="256" stroke="#1e293b" stroke-width="2"/>

  <!-- Center Shield / Legal Balance -->
  <path d="M256 96 L384 152 V272 C384 352 256 416 256 416 C256 416 128 352 128 272 V152 Z" 
        fill="url(#shieldGrad)" 
        filter="url(#shadow)"
        stroke="#7dd3fc"
        stroke-width="6" />

  <!-- Balance of Justice & Location Pin inside shield -->
  <g transform="translate(256, 256) scale(1.15)">
    <!-- Scale Beam -->
    <path d="M-50 -30 L50 -30" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="-30" r="6" fill="#ffffff" />
    <path d="M0 -30 L0 40" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <path d="M-24 40 L24 40" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Left Plate -->
    <path d="M-50 -30 L-68 0 L-32 0 Z" stroke="#ffffff" stroke-width="3" fill="rgba(255,255,255,0.2)"/>
    
    <!-- Right Plate -->
    <path d="M50 -30 L32 0 L68 0 Z" stroke="#ffffff" stroke-width="3" fill="rgba(255,255,255,0.2)"/>

    <!-- Center Pulse Beacon -->
    <circle cx="0" cy="5" r="7" fill="#38bdf8" />
  </g>
</svg>

